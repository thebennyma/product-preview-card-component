<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet"/>

  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <main class="page">
    <div class="card-wrapper">
      <article class="card">
        <picture class="card__media">
          <source
            media="(max-width: 640px)"
            srcset="./images/image-product-mobile.jpg"
          />
          <img
            class="card__img"
            src="./images/image-product-desktop.jpg"
            alt="Gabrielle Essence Eau De Parfum bottle on a table with green leaves"
            loading="lazy"
          />
        </picture>

        <div class="card__content">
          <p class="card__tag">Perfume</p>

          <h1 class="card__title">
            Gabrielle Essence Eau De Parfum
          </h1>

          <p class="card__desc">
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>

          <div class="card__prices">
            <p class="card__price">$149.99</p>
            <p class="card__price--old">
              <s>$169.99</s>
            </p>
          </div>

          <button class="card__btn" type="button">
            <span class="card__btn-icon" aria-hidden="true">
              <img src="./images/icon-cart.svg" alt="" />
            </span>
            Add to Cart
          </button>
        </div>
      </article>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">
        Frontend Mentor
      </a>.
      Coded by <a href="https://github.com/thebennyma" target="_blank" rel="noopener noreferrer">Marco Alvarado</a>.
    </footer>
  </main>
</body>
</html>
